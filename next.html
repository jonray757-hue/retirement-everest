<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thursday is full</title>
<meta http-equiv="refresh" content="0;url=/next">
<script>
(function () {
  var intent = (new URLSearchParams(location.search).get('intent') || '').toLowerCase();
  var q = (intent === 'next' || intent === 'review') ? ('?intent=' + encodeURIComponent(intent)) : '';
  location.replace('/next' + q);
})();
</script>
</head>
<body>
  <p><a href="/next">Continue</a></p>
</body>
</html>
