<script>
/* Old poll URL has no seat chart. Send guests to the live BBQ form before the page paints. */
(function () {
  try {
    var p = new URLSearchParams(location.search);
    var loc = (p.get('location') || p.get('loc') || '').trim();
    if (loc === 'kennedy-school') {
      p.set('location', 'kennedy-school-bbq');
      p.delete('loc');
      location.replace(location.pathname + '?' + p.toString() + location.hash);
    }
  } catch (e) {}
})();
</script>
</head>
